            <circle cx="192" cy="140" r="24" fill="none" stroke="rgba(255, 179, 0, 0.4)" stroke-width="1.5" stroke-dasharray="4,3" />
            <text x="192" y="145" fill="#0b0f16" font-size="13" font-weight="900" text-anchor="middle">Z</text>
        </g>
    </g>

    <!-- Bottom Instruction Bar -->
    <rect x="20" y="348" width="800" height="66" rx="10" fill="#0c131f" stroke="rgba(0, 229, 255, 0.25)" stroke-width="1.5" />
    <text x="420" y="372" fill="#ffb300" font-size="13" font-weight="bold" text-anchor="middle">
        💡 TRICK: Knoten [ Z ] ist das Rad-Zentrum (Hub)!
    </text>
    <text x="420" y="394" fill="#94a3b8" font-size="12" text-anchor="middle">
        Ziehe Knoten [ Z ] in die Mitte und ordne die Knoten [ 1, 2, 3, 4, 5, 6 ] als Kreisring (Hexagon) außen herum an.
    </text>
</svg>
