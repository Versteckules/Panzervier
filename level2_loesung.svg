        <circle cx="250" cy="190" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2" />
        <text x="250" y="194" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">1</text>

        <!-- Node 2 -->
        <circle cx="120" cy="80" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2" />
        <text x="120" y="84" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">2</text>

        <!-- Node 3 -->
        <circle cx="190" cy="225" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2" />
        <text x="190" y="229" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">3</text>

        <!-- Node 4 -->
        <circle cx="190" cy="45" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2" />
        <text x="190" y="49" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">4</text>

        <!-- Node 5 -->
        <circle cx="250" cy="80" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2" />
        <text x="250" y="84" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">5</text>

        <!-- Node 6 -->
        <circle cx="120" cy="190" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2" />
        <text x="120" y="194" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">6</text>

        <!-- Hub Z -->
        <circle cx="75" cy="135" r="15" fill="url(#hubGrad)" stroke="#ffb300" stroke-width="2.5" />
        <text x="75" y="139" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Z</text>
    </g>

    <!-- ============================================================ -->
    <!-- PANEL 2: ENTWIRRTE LÖSUNG (RAD / HEXAGON MIT ZENTRUM)        -->
    <!-- ============================================================ -->
    <g transform="translate(435, 62)">
        <!-- Container Box -->
        <rect x="0" y="0" width="385" height="270" rx="10" fill="#070c14" stroke="#00e676" stroke-width="2" />
        
        <!-- Cyber Blueprint Grid -->
        <path d="M 0 45 L 385 45 M 0 90 L 385 90 M 0 135 L 385 135 M 0 180 L 385 180 M 0 225 L 385 225
                 M 45 0 L 45 270 M 90 0 L 90 270 M 135 0 L 135 270 M 180 0 L 180 270 M 225 0 L 225 270 M 270 0 L 270 270 M 315 0 L 315 270 M 360 0 L 360 270" 
              stroke="rgba(0,229,255,0.04)" stroke-width="1" />

        <!-- Badge -->
        <rect x="12" y="10" width="130" height="20" rx="4" fill="rgba(0, 230, 118, 0.15)" stroke="#00e676" stroke-width="1" />
        <text x="77" y="24" fill="#00e676" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">0 KREUZUNGEN ✓</text>
        <text x="370" y="24" fill="#00e676" font-size="11" font-weight="bold" text-anchor="end">FERTIGE LÖSUNG</text>

        <!-- Solved Hexagon Coordinates around Center (192, 140) with R=85 -->
        <!-- 1: (192, 55) -->
        <!-- 2: (265, 97) -->
        <!-- 3: (265, 183) -->
        <!-- 4: (192, 225) -->
        <!-- 5: (119, 183) -->
        <!-- 6: (119, 97) -->
        <!-- Z: (192, 140) -->

        <!-- 6 Glowing Emerald Spokes from Center Z to 1..6 -->
        <line x1="192" y1="140" x2="192" y2="55" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="192" y1="140" x2="192" y2="55" stroke="#00e676" stroke-width="3" stroke-linecap="round" />
        <line x1="192" y1="140" x2="192" y2="55" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

        <line x1="192" y1="140" x2="265" y2="97" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="192" y1="140" x2="265" y2="97" stroke="#00e676" stroke-width="3" stroke-linecap="round" />
        <line x1="192" y1="140" x2="265" y2="97" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

        <line x1="192" y1="140" x2="265" y2="183" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="192" y1="140" x2="265" y2="183" stroke="#00e676" stroke-width="3" stroke-linecap="round" />
        <line x1="192" y1="140" x2="265" y2="183" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

        <line x1="192" y1="140" x2="192" y2="225" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="192" y1="140" x2="192" y2="225" stroke="#00e676" stroke-width="3" stroke-linecap="round" />
        <line x1="192" y1="140" x2="192" y2="225" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

        <line x1="192" y1="140" x2="119" y2="183" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="192" y1="140" x2="119" y2="183" stroke="#00e676" stroke-width="3" stroke-linecap="round" />
        <line x1="192" y1="140" x2="119" y2="183" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

        <line x1="192" y1="140" x2="119" y2="97" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="192" y1="140" x2="119" y2="97" stroke="#00e676" stroke-width="3" stroke-linecap="round" />
        <line x1="192" y1="140" x2="119" y2="97" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

        <!-- Outer Ring Edges: 1-2-3-4-5-6-1 -->
        <line x1="192" y1="55" x2="265" y2="97" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="192" y1="55" x2="265" y2="97" stroke="#00e676" stroke-width="3.5" stroke-linecap="round" />
        <line x1="192" y1="55" x2="265" y2="97" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

        <line x1="265" y1="97" x2="265" y2="183" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="265" y1="97" x2="265" y2="183" stroke="#00e676" stroke-width="3.5" stroke-linecap="round" />
        <line x1="265" y1="97" x2="265" y2="183" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

        <line x1="265" y1="183" x2="192" y2="225" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="265" y1="183" x2="192" y2="225" stroke="#00e676" stroke-width="3.5" stroke-linecap="round" />
        <line x1="265" y1="183" x2="192" y2="225" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

        <line x1="192" y1="225" x2="119" y2="183" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="192" y1="225" x2="119" y2="183" stroke="#00e676" stroke-width="3.5" stroke-linecap="round" />
        <line x1="192" y1="225" x2="119" y2="183" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

        <line x1="119" y1="183" x2="119" y2="97" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="119" y1="183" x2="119" y2="97" stroke="#00e676" stroke-width="3.5" stroke-linecap="round" />
        <line x1="119" y1="183" x2="119" y2="97" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

        <line x1="119" y1="97" x2="192" y2="55" stroke="rgba(0,230,118,0.25)" stroke-width="8" stroke-linecap="round" />
        <line x1="119" y1="97" x2="192" y2="55" stroke="#00e676" stroke-width="3.5" stroke-linecap="round" />
        <line x1="119" y1="97" x2="192" y2="55" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />

        <!-- Solved Nodes (Outer Hexagon 1..6) -->
        <g>
            <circle cx="192" cy="55" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2.5" />
            <text x="192" y="59" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">1</text>
        </g>
        <g>
            <circle cx="265" cy="97" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2.5" />
            <text x="265" y="101" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">2</text>
        </g>
        <g>
            <circle cx="265" cy="183" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2.5" />
            <text x="265" y="187" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">3</text>
        </g>
        <g>
            <circle cx="192" cy="225" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2.5" />
            <text x="192" y="229" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">4</text>
        </g>
        <g>
            <circle cx="119" cy="183" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2.5" />
            <text x="119" y="187" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">5</text>
        </g>
        <g>
            <circle cx="119" cy="97" r="14" fill="url(#nodeGrad)" stroke="#00e5ff" stroke-width="2.5" />
            <text x="119" y="101" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">6</text>
        </g>

        <!-- Center Hub Z with Radiant Amber/Gold Glow -->
